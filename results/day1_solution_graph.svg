<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <filter id="sol-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="340.0" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Final Solution Coloring (Bitstring '0101')</text>
  <text x="340.0" y="60" text-anchor="middle" font-size="13" fill="#64748b">Optimal Two-Coloring with 100% Severed Cut Edges (Max-Cut = 4.0)</text>

  <!-- Background Panel -->
  <rect x="35" y="78" width="610" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Edges: All are severed cut edges! -->
  <line x1="185" y1="140" x2="495" y2="140" stroke="#f59e0b" stroke-width="4.5" stroke-dasharray="7,5" stroke-linecap="round"/>
  <rect x="308.0" y="99.1" width="64" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="340.0" y="116.1" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">CUT (w=1)</text>
  <line x1="495" y1="140" x2="495" y2="450" stroke="#f59e0b" stroke-width="4.5" stroke-dasharray="7,5" stroke-linecap="round"/>
  <rect x="490.9" y="282.0" width="64" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="522.9" y="299.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">CUT (w=1)</text>
  <line x1="495" y1="450" x2="185" y2="450" stroke="#f59e0b" stroke-width="4.5" stroke-dasharray="7,5" stroke-linecap="round"/>
  <rect x="308.0" y="464.9" width="64" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="340.0" y="481.9" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">CUT (w=1)</text>
  <line x1="185" y1="450" x2="185" y2="140" stroke="#f59e0b" stroke-width="4.5" stroke-dasharray="7,5" stroke-linecap="round"/>
  <rect x="125.1" y="282.0" width="64" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="157.1" y="299.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">CUT (w=1)</text>

  <g filter="url(#sol-shadow)">
    <circle cx="185" cy="140" r="34" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="185" y="141" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">v0</text>
    <text x="185" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#fef08a">bit '0'</text>
  </g>
  <g filter="url(#sol-shadow)">
    <circle cx="495" cy="140" r="34" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <text x="495" y="141" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">v1</text>
    <text x="495" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#fef08a">bit '1'</text>
  </g>
  <g filter="url(#sol-shadow)">
    <circle cx="495" cy="450" r="34" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="495" y="451" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">v2</text>
    <text x="495" y="467" text-anchor="middle" font-size="11" font-weight="600" fill="#fef08a">bit '0'</text>
  </g>
  <g filter="url(#sol-shadow)">
    <circle cx="185" cy="450" r="34" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <text x="185" y="451" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">v3</text>
    <text x="185" y="467" text-anchor="middle" font-size="11" font-weight="600" fill="#fef08a">bit '1'</text>
  </g>
  <!-- Legend Bar -->
  <rect x="40" y="555" width="600" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="85" cy="578" r="8" fill="#ef4444"/>
  <text x="100" y="582" font-size="11.5" font-weight="600" fill="#334155">Partition S₀ (Bit '0'): &#123;v₀, v₂&#125;</text>

  <circle cx="280" cy="578" r="8" fill="#2563eb"/>
  <text x="295" y="582" font-size="11.5" font-weight="600" fill="#334155">Partition S₁ (Bit '1'): &#123;v₁, v₃&#125;</text>

  <line x1="480" y1="578" x2="515" y2="578" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="4,3"/>
  <text x="525" y="582" font-size="11.5" font-weight="600" fill="#b45309">Cut Edge (|E_cut| = 4)</text>

  <!-- Verified Ground State Banner -->
  <text x="340.0" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">&#10004; Verified Ground State: AR = 1.0000 | Ground State Energy = -4.0000</text>
</svg>
  <rect x="304.0" y="111.4" width="52" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="129.4" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">w = 1.0</text>
  <line x1="490" y1="150" x2="490" y2="470" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <rect x="489.6" y="297.0" width="52" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="515.6" y="315.0" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">w = 1.0</text>
  <line x1="490" y1="470" x2="170" y2="470" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <rect x="304.0" y="482.6" width="52" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="500.6" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">w = 1.0</text>
  <line x1="170" y1="470" x2="170" y2="150" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <rect x="118.4" y="297.0" width="52" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="144.4" y="315.0" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">w = 1.0</text>

  <g filter="url(#shadow)">

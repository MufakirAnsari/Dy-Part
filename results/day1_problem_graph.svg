    <text x="170" y="158" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">v0</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="490" cy="150" r="32" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    <text x="490" y="158" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">v1</text>
  </g>
  <g filter="url(#shadow)">

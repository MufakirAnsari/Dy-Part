  <rect x="50" y="588" width="560" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="330.0" y="614" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Max-Cut Hamiltonian: H = ∑ ZᵢZⱼ (4 Pauli Terms) | Optimal Ground State: E₀ = -4.0</text>
